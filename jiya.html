<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Jiya ❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins;}

body{
    height:100vh;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.page{display:none;width:100%;}
.active{display:flex;justify-content:center;align-items:center;}

.container{
    background:white;
    padding:20px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    text-align:center;
    width:95%;
    max-width:360px;
    animation:fadeIn 0.8s ease;
}

@keyframes fadeIn{
    from{opacity:0;transform:scale(0.9);}
    to{opacity:1;transform:scale(1);}
}

img{
    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #ff4b5c;
    margin-bottom:12px;
}

h1{color:#ff4b5c;font-size:20px;margin-bottom:8px;}
p{font-size:16px;margin-bottom:15px;}

button{
    padding:10px 18px;
    border:none;
    border-radius:25px;
    margin:5px;
    font-size:14px;
    cursor:pointer;
}

.yes{background:#ff4b5c;color:white;}
.no{background:#ccc;}

#runBtn{position:fixed;}

.heart{
    position:absolute;
    animation:float 5s linear infinite;
}
@keyframes float{
    from{transform:translateY(100vh);opacity:1;}
    to{transform:translateY(-10vh);opacity:0;}
}

.fire{
    position:absolute;
    width:5px;
    height:5px;
    background:red;
    border-radius:50%;
    animation:boom 1s forwards;
}
@keyframes boom{
    to{transform:translate(var(--x),var(--y));opacity:0;}
}

@media(max-width:400px){
    h1{font-size:18px;}
    p{font-size:14px;}
    img{width:75px;height:75px;}
}
</style>
</head>

<body>

<audio id="music" src="osam.mp3" loop></audio>

<!-- PAGE 1 -->
<div class="page active" id="p1">
<div class="container">
<img src="jiya/1.jpeg">
<h1>Hey Jiya ❤️</h1>
<p>I have something special for you 💌</p>
<button class="yes" onclick="next(1)">Start ❤️</button>
</div>
</div>

<!-- PAGE 2 -->
<div class="page" id="p2">
<div class="container">
<img src="jiya/2.jpeg">
<h1>You know 🥺</h1>
<p>You make my life beautiful 💖</p>
<button class="yes" onclick="next(2)">Next ➡️</button>
</div>
</div>

<!-- PAGE 3 -->
<div class="page" id="p3">
<div class="container">
<img src="jiya/3.jpeg">
<h1>Tell me honestly 😳</h1>
<p>Do you love me?</p>
<button class="yes" onclick="goFinal()">Yes 😍</button>
<button class="no" onclick="goThink()">No 😅</button>
</div>
</div>

<!-- THINK AGAIN PAGE -->
<div class="page" id="p4">
<div class="container">
<img src="jiya/4.jpeg">
<h1>Think again 😭</h1>
<p>Are you really sure? 🥺💔</p>
<button class="yes" onclick="goFinal()">Okay Fine 😍</button>
<button class="no" id="runBtn">No 😅</button>
</div>
</div>

<!-- FINAL PAGE -->
<div class="page" id="p5">
<div class="container">
<img src="jiya/5.jpeg">
<h1>I knew it ❤️</h1>
<p>You are my everything 💖</p>
<h2 style="font-size:18px;">Will you be mine forever? 💍</h2>
<button class="yes" onclick="celebrate()">YES ❤️</button>
</div>
</div>

<script>
document.body.addEventListener("click",()=>{
    document.getElementById("music").play();
},{once:true});

function next(n){
    document.getElementById("p"+n).classList.remove("active");
    document.getElementById("p"+(n+1)).classList.add("active");
}

function goThink(){
    document.getElementById("p3").classList.remove("active");
    document.getElementById("p4").classList.add("active");
}

function goFinal(){
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById("p5").classList.add("active");
}

/* Runaway button */
const btn=document.getElementById("runBtn");
btn.addEventListener("mouseover",move);
btn.addEventListener("click",move);

function move(){
    let x=(Math.random()*window.innerWidth*0.8);
    let y=(Math.random()*window.innerHeight*0.8);

    btn.style.left=x+"px";
    btn.style.top=y+"px";
}

/* Hearts */
setInterval(()=>{
    let h=document.createElement("div");
    h.className="heart";
    h.innerHTML="❤️";
    h.style.left=Math.random()*100+"vw";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),5000);
},400);

/* Fireworks */
function celebrate(){
    for(let i=0;i<40;i++){
        let f=document.createElement("div");
        f.className="fire";
        f.style.left="50%";
        f.style.top="50%";

        let x=(Math.random()*300-150)+"px";
        let y=(Math.random()*300-150)+"px";

        f.style.setProperty("--x",x);
        f.style.setProperty("--y",y);

        document.body.appendChild(f);
        setTimeout(()=>f.remove(),1000);
    }
}
</script>

</body>
</html>
